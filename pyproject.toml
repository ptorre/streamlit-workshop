[project]
name = "streamlit-workshop"
version = "0.1.0"
description = "Streamlit workshop demo app using US Census demographic data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "censusdis>=1.4.2",
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "kaleido>=1.1.0",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "streamlit>=1.49.1",
    "us>=3.2.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B"]
ignore = ["ANN401"]
